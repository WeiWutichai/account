<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;width:960px;height:300px;position:relative;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);overflow:hidden}
svg{position:absolute;inset:0}
.blue{fill:var(--interactive)}.ink{fill:var(--text-primary)}.layer{fill:var(--bg-layer-1)}.sel{fill:var(--bg-selected)}.ok{fill:var(--status-success)}.warn{fill:var(--status-warning)}
.rule{stroke:var(--border-subtle);stroke-width:1}
h1{position:absolute;left:48px;bottom:56px;margin:0;font-size:72px;line-height:.95;font-weight:600;letter-spacing:-1px;max-width:440px}
p{position:absolute;left:48px;bottom:28px;margin:0;font-size:14px;color:var(--text-secondary);max-width:440px}
</style></head><body>
<!--
blocks: interactive 224x136 · text-primary 96x136 · bg-layer-1 320x88 · bg-selected 128x88 · status-success 48x24 · status-warning 48x24 — sides are multiples of space-03/space-05
arrangement: a ledger — two columns of flush blocks (Dr | Cr) stacked on an 8px gutter, bleeding off the right edge
pattern: hairline rules at row-compact (32px) pitch across the light blocks — "ตารางและฟอร์มเป็นหลัก", a dense accounting grid, borders not shadows
scales: gutter space-03 8px, rows row-compact 32px, corners radius-none 0 (radius-sm 4px only on the two status tags)
-->
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
  <rect class="blue" x="480" y="24" width="224" height="136"/>
  <rect class="ink" x="712" y="24" width="96" height="136"/>
  <rect class="layer" x="816" y="24" width="160" height="136"/>
  <rect class="layer" x="480" y="168" width="320" height="108"/>
  <rect class="sel" x="808" y="168" width="168" height="108"/>
  <g class="rule">
    <line x1="480" y1="200" x2="976" y2="200"/><line x1="480" y1="232" x2="976" y2="232"/><line x1="480" y1="264" x2="976" y2="264"/>
    <line x1="816" y1="56" x2="976" y2="56"/><line x1="816" y1="88" x2="976" y2="88"/><line x1="816" y1="120" x2="976" y2="120"/><line x1="816" y1="152" x2="976" y2="152"/>
  </g>
  <rect class="ok" x="496" y="176" width="48" height="24" rx="4"/>
  <rect class="warn" x="552" y="176" width="48" height="24" rx="4"/>
</svg>
<h1>AccountSystem<br>Carbon TH</h1>
<p>ระบบบัญชีที่หน้าตาคุ้นเหมือนโปรแกรมองค์กร — ตาราง ตัวเลขตรงหลัก สีเดียว</p>
</body></html>
