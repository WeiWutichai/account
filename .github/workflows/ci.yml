# CI (ยังไม่มี remote — ไฟล์นี้พร้อมใช้เมื่อ push ขึ้น GitHub) · ในเครื่องใช้ `pnpm verify`
name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm i -g corepack@0.34.6 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
