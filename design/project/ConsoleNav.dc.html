<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Console nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cn a{color:#f4f4f4;text-decoration:none}
.cn .it:hover{background:#393939}
.cn a:focus-visible{outline:2px solid #78a9ff;outline-offset:-2px}
</style>
</helmet>
<nav class="cn" aria-label="เมนู Console" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 1000px; background: #161616; color: #f4f4f4; font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #393939">
    <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 6px; background: #0f62fe; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">IN</span>
    <span style="line-height: 1.2"><span style="font-weight: 600; font-size: 15px; display: block">Innovera Console</span><span style="font-size: 11px; color: #a8a8a8">back-office · เฉพาะทีม Innovera</span></span>
  </div>
  <div style="margin: 12px 12px 4px; padding: 8px 12px; border: 1px solid #393939; border-radius: 6px; font-size: 12px; color: #c6c6c6; display: flex; justify-content: space-between; gap: 8px"><span>สภาพแวดล้อม</span><span style="color: #42be65; font-weight: 600">production</span></div>
  <div style="display: flex; flex-direction: column; padding: 8px 8px 12px; overflow-y: auto; gap: 1px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
      <sc-if value="{{item.group}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #8d8d8d; padding: 12px 10px 4px; letter-spacing: .3px; text-transform: uppercase">{{item.group}}</span></sc-if>
      <sc-if value="{{item.on}}" hint-placeholder-val="{{false}}"><a href="{{item.href}}" aria-current="page" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; padding: 0 10px 0 9px; border-left: 3px solid #78a9ff; border-radius: 0 6px 6px 0; background: #393939; color: #ffffff; font-weight: 600">{{item.label}}<sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: {{item.badgeBg}}; color: #161616; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{item.badge}}</span></sc-if></a></sc-if>
      <sc-if value="{{item.off}}" hint-placeholder-val="{{true}}"><a class="it" href="{{item.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; padding: 0 10px 0 12px; border-radius: 6px; color: #e0e0e0">{{item.label}}<sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: {{item.badgeBg}}; color: #161616; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{item.badge}}</span></sc-if></a></sc-if>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid #393939; font-size: 13px">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #393939; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">W</span>
    <span style="line-height: 1.35; flex: 1; min-width: 0">Wei<br><span style="color: #a8a8a8">superadmin · 2FA + hardware key</span></span>
    <a href="ScreenLogin.dc.html" aria-label="ออกจากระบบ" style="display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#c6c6c6" stroke-width="1.5" aria-hidden="true"><path d="M6 3H3v10h3M10 5l3 3-3 3M13 8H6"/></svg></a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","tenants","billing","support","flags","reference","ops","team"],"default":"overview"},"$preview":{"width":256,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const list = [
      { id: 'overview', label: 'ภาพรวมแพลตฟอร์ม', href: 'ConsoleOverview.dc.html' },
      { id: 'tenants', label: 'องค์กร (tenants)', href: 'ConsoleTenants.dc.html', group: 'ลูกค้า', badge: '4', tone: 'warn' },
      { id: 'billing', label: 'Subscription & billing', href: 'ConsoleBilling.dc.html', badge: 'P2', tone: 'p2' },
      { id: 'support', label: 'Support / impersonate', href: 'ConsoleSupport.dc.html', badge: '3', tone: 'act' },
      { id: 'flags', label: 'แอปและ feature flags', href: 'ConsoleFlags.dc.html', group: 'แพลตฟอร์ม' },
      { id: 'reference', label: 'ข้อมูลอ้างอิงกลาง', href: 'ConsoleReference.dc.html' },
      { id: 'ops', label: 'Ops / งานค้าง', href: 'ConsoleOps.dc.html', badge: '7', tone: 'warn' },
      { id: 'team', label: 'ทีม Innovera และ Audit', href: 'ConsoleTeam.dc.html', group: 'ภายใน' }
    ];
    const tones = { act: '#78a9ff', warn: '#f1c21b', p2: '#be95ff' };
    return { items: list.map((x) => ({ ...x, group: x.group || '', badge: x.badge || '', badgeBg: tones[x.tone] || '#c6c6c6', on: x.id === active, off: x.id !== active })) };
  }
}
</script>
</body>
</html>
