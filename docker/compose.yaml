# dev stack · เวอร์ชัน pin ตาม docs/technical-plan-M0.md §3 · พอร์ตเลี่ยงโปรเจกต์อื่นในเครื่อง
name: innovera
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: innovera
    ports: ["55432:5432"]          # ต่อตรง: ใช้กับ migration / spike setup เท่านั้น
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=200", "-c", "log_min_duration_statement=-1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innovera"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["56432:5432"]          # แอปต่อทางนี้เสมอ
    depends_on:
      postgres: { condition: service_healthy }
  redis:
    image: redis:8.10.3
    ports: ["56379:6379"]
volumes:
  pgdata:
