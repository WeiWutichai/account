; PgBouncer · transaction mode (PLAN §2: ห้าม session state)
[databases]
innovera = host=postgres port=5432 dbname=innovera
innovera_test = host=postgres port=5432 dbname=innovera_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
ignore_startup_parameters = extra_float_digits,options
admin_users = app
